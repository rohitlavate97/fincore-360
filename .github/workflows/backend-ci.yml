name: FinCore 360 - Backend CI/CD

on:
  push:
    branches: [ main ]
    paths:
      - 'backend/**'
      - 'infra/docker/backend.Dockerfile'
      - '.github/workflows/backend-ci.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'backend/**'
      - 'infra/docker/backend.Dockerfile'
      - '.github/workflows/backend-ci.yml'

concurrency:
  group: backend-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── STAGE 1: VALIDATE ──────────────────────────────────────────
  validate:
    name: "Stage 1 · Validate"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '25'
          cache: 'gradle'

      - name: Validate Gradle Wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Compile Kotlin and Java
        working-directory: ./backend
        run: ./gradlew compileKotlin compileTestKotlin --no-daemon

      - name: Dependency Conflict and License Check
        working-directory: ./backend
        run: ./gradlew dependencies --no-daemon

  # ── STAGE 2: TEST & COVERAGE ──────────────────────────────────
  test:
    name: "Stage 2 · Test & Coverage"
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '25'
          cache: 'gradle'

      - name: Run Full Test Suite & Coverage
        working-directory: ./backend
        run: ./gradlew test jacocoTestReport --no-daemon

      - name: Verify JaCoCo Coverage Thresholds
        working-directory: ./backend
        run: ./gradlew jacocoTestCoverageVerification --no-daemon

      - name: Publish Test Results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-test-results
          path: backend/build/reports/tests/test/

      - name: Publish JaCoCo Coverage Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-jacoco-report
          path: backend/build/reports/jacoco/test/html/

  # ── STAGE 3: SECURITY SCANNING ────────────────────────────────
  security:
    name: "Stage 3 · Security Analysis"
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Secret Detection (Gitleaks)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: OWASP Dependency Vulnerability Review
        uses: actions/dependency-review-action@v4
        if: github.event_name == 'pull_request'

  # ── STAGE 4: BUILD & CONTAINER SCAN ───────────────────────────
  build-container:
    name: "Stage 4 · Build & Container Scan"
    needs: [test, security]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Backend Production Image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./infra/docker/backend.Dockerfile
          push: false
          load: true
          tags: fincore-backend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Container Vulnerability Scan (Trivy)
        uses: aquasecurity/trivy-action@0.29.0
        with:
          image-ref: fincore-backend:${{ github.sha }}
          format: 'table'
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL'

  # ── STAGE 5: ARTIFACT PACKAGING ───────────────────────────────
  artifact:
    name: "Stage 5 · Artifact Packaging"
    needs: [test, build-container]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '25'
          cache: 'gradle'

      - name: Build BootJar
        working-directory: ./backend
        run: ./gradlew bootJar --no-daemon -x test

      - name: Upload Application JAR
        uses: actions/upload-artifact@v4
        with:
          name: fincore-backend-jar
          path: backend/build/libs/*.jar
          retention-days: 14

  # ── STAGE 6: STAGING DEPLOY & SMOKE TESTS ─────────────────────
  deploy-staging:
    name: "Stage 6 · Staging Deploy & Smoke Test"
    needs: [build-container, artifact]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Execute Staging Migration Validation
        run: |
          echo "Simulating pre-deployment Flyway schema validation..."
          echo "Verifying backward compatibility for zero-downtime rolling deploy..."

      - name: Deploy to Staging Cluster
        run: |
          echo "Applying Kubernetes manifests to staging namespace..."
          echo "Simulating rollout restart of deployment/fincore-backend..."

      - name: Run Staging Smoke Tests
        run: |
          chmod +x ./infra/scripts/smoke-test.sh
          ./infra/scripts/smoke-test.sh http://localhost:8080 || {
            echo "Smoke test failed! Triggering automated rollback...";
            chmod +x ./infra/scripts/rollback.sh;
            ./infra/scripts/rollback.sh;
            exit 1;
          }
