{{- if .Values.migration.enabled -}}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "fincore.fullname" . }}-flyway-migration
  labels:
    {{- include "fincore.labels" . | nindent 4 }}
    app.kubernetes.io/component: migration
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-delete-policy": before-hook-creation
spec:
  backoffLimit: 2
  activeDeadlineSeconds: 300
  template:
    metadata:
      labels:
        {{- include "fincore.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: migration
    spec:
      restartPolicy: OnFailure
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: flyway-migration
          image: "{{ .Values.migration.image.repository }}:{{ .Values.migration.image.tag }}"
          args:
            - "-url=$(DB_URL)"
            - "-user=$(DB_USERNAME)"
            - "-password=$(DB_PASSWORD)"
            - "-connectRetries=10"
            - "migrate"
          envFrom:
            - secretRef:
                name: {{ .Values.database.existingSecret | default (printf "%s-secrets" (include "fincore.fullname" .)) }}
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
{{- end }}
