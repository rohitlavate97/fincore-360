# Default values for fincore-360 Helm Chart

global:
  environment: "development"
  domain: "fincore360.internal"

backend:
  replicaCount: 2
  image:
    repository: fincore-backend
    pullPolicy: IfNotPresent
    tag: "latest"
  service:
    type: ClusterIP
    port: 8080
  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      cpu: 1000m
      memory: 1Gi
  autoscaling:
    enabled: false
    minReplicas: 2
    maxReplicas: 5
    targetCPUUtilizationPercentage: 70
    targetMemoryUtilizationPercentage: 80
  env:
    APP_ENV: "development"
    LOG_FORMAT: "ecs"
    LOG_LEVEL_FINCORE: "INFO"
    DB_PORT: "5432"
    DB_NAME: "fincore"
    DB_POOL_MAX: "10"
    SPRING_PROFILES_ACTIVE: "default"

web:
  replicaCount: 2
  image:
    repository: fincore-web
    pullPolicy: IfNotPresent
    tag: "latest"
  service:
    type: ClusterIP
    port: 80
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 250m
      memory: 128Mi

ingress:
  enabled: true
  className: "nginx"
  annotations:
    kubernetes.io/ingress.class: "nginx"
    nginx.ingress.kubernetes.io/ssl-redirect: "false"
  hosts:
    - host: banking.fincore360.internal
      paths:
        - path: /api
          pathType: Prefix
          service: backend
        - path: /actuator
          pathType: Prefix
          service: backend
        - path: /
          pathType: Prefix
          service: web
  tls: []

migration:
  enabled: true
  image:
    repository: flyway/flyway
    tag: "10-alpine"

database:
  host: "postgres-ha.fincore.svc.cluster.local"
  port: 5432
  name: "fincore"
  username: "fincore_app"
  existingSecret: "fincore-secrets"
