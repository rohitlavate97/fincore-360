# NOTE: In production, inject secrets via SealedSecrets, HashiCorp Vault,
# AWS Secrets Manager, or Google Secret Manager. NEVER commit raw plaintext secrets.
apiVersion: v1
kind: Secret
metadata:
  name: fincore-secrets
  namespace: fincore
  labels:
    app.kubernetes.io/name: fincore-secrets
    app.kubernetes.io/part-of: fincore-360
type: Opaque
stringData:
  DB_URL: "jdbc:postgresql://postgres-ha.fincore.svc.cluster.local:5432/fincore"
  DB_USERNAME: "fincore_app"
  DB_PASSWORD: "REPLACE_WITH_KMS_MANAGED_SECRET"
  JWT_PRIVATE_KEY: "REPLACE_WITH_RS256_PRIVATE_KEY_PEM"
  JWT_PUBLIC_KEY: "REPLACE_WITH_RS256_PUBLIC_KEY_PEM"
