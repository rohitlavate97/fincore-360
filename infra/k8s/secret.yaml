# Production ExternalSecret pulling encrypted secrets from AWS Secrets Manager (KMS-backed)
# Zero plaintext secrets or mock credentials committed in Git.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: fincore-secrets
  namespace: fincore
  labels:
    app.kubernetes.io/name: fincore-secrets
    app.kubernetes.io/part-of: fincore-360
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secrets-manager
    kind: ClusterSecretStore
  target:
    name: fincore-secrets
    creationPolicy: Owner
  data:
    - secretKey: DB_URL
      remoteRef:
        key: fincore/production/database
        property: url
    - secretKey: DB_USERNAME
      remoteRef:
        key: fincore/production/database
        property: username
    - secretKey: DB_PASSWORD
      remoteRef:
        key: fincore/production/database
        property: password
    - secretKey: JWT_PRIVATE_KEY
      remoteRef:
        key: fincore/production/jwt
        property: privateKey
    - secretKey: JWT_PUBLIC_KEY
      remoteRef:
        key: fincore/production/jwt
        property: publicKey
